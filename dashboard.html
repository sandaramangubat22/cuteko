<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My dashboard — MIST Job Portal</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <header id="app-header"></header>

  <main class="container">
    <div class="page-head">
      <div>
        <h1 id="greeting">My dashboard</h1>
        <p>Track every application you have sent.</p>
      </div>
      <a class="btn btn-primary" href="/jobs.html">Find more jobs</a>
    </div>

    <div class="stats" style="margin-bottom:1.5rem">
      <div class="stat"><div class="label">Applications</div><div class="value" id="stat-total">—</div></div>
      <div class="stat"><div class="label">In progress</div><div class="value" id="stat-progress">—</div></div>
      <div class="stat"><div class="label">Interviews</div><div class="value" id="stat-interviews">—</div></div>
      <div class="stat"><div class="label">Hired</div><div class="value" id="stat-hired">—</div></div>
    </div>

    <div id="applications-root">
      <div class="skeleton" style="height:140px"></div>
    </div>
  </main>

  <footer id="app-footer"></footer>

  <script src="/assets/js/config.js"></script>
  <script type="module" src="/assets/js/pages/dashboard.js"></script>
</body>
</html>
