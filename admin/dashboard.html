<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — MIST Job Portal</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <header id="app-header"></header>

  <main class="container">
    <div class="page-head">
      <div>
        <h1>Admin console</h1>
        <p>Moderate accounts, companies, and job posts.</p>
      </div>
    </div>

    <div class="stats" style="margin-bottom:1.5rem">
      <div class="stat"><div class="label">Users</div><div class="value" id="stat-users">—</div></div>
      <div class="stat"><div class="label">Companies</div><div class="value" id="stat-companies">—</div></div>
      <div class="stat"><div class="label">Job posts</div><div class="value" id="stat-jobs">—</div></div>
      <div class="stat"><div class="label">Applications</div><div class="value" id="stat-applications">—</div></div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="companies">Companies</button>
      <button class="tab" data-tab="users">Users</button>
      <button class="tab" data-tab="jobs">Job posts</button>
      <button class="tab" data-tab="feedback">Feedback</button>
    </div>

    <section id="panel-companies"><div class="skeleton" style="height:140px"></div></section>
    <section id="panel-users" class="hidden"><div class="skeleton" style="height:140px"></div></section>
    <section id="panel-jobs" class="hidden"><div class="skeleton" style="height:140px"></div></section>
    <section id="panel-feedback" class="hidden"><div class="skeleton" style="height:140px"></div></section>
  </main>

  <footer id="app-footer"></footer>

  <script src="/assets/js/config.js"></script>
  <script type="module" src="/assets/js/pages/admin.js"></script>
</body>
</html>
