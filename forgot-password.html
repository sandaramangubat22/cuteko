<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot password — MIST Job Portal</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <header id="app-header"></header>

  <main class="auth-wrap">
    <div class="auth-card card pad-lg">
      <h1 style="font-size:1.6rem">Reset your password</h1>
      <p class="muted">Enter the email on your account and we'll send you a reset link.</p>

      <form class="form" id="forgot-form" novalidate>
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <p class="error-text hidden" id="forgot-error"></p>
        <p class="success-text hidden" id="forgot-success"></p>
        <button class="btn btn-primary btn-block" type="submit" id="forgot-submit">Send reset link</button>
      </form>

      <p class="center muted" style="margin:1rem 0 0;font-size:.88rem">
        Remembered it? <a href="/login.html">Back to sign in</a>
      </p>
    </div>
  </main>

  <footer id="app-footer"></footer>

  <script src="/assets/js/config.js"></script>
  <script type="module" src="/assets/js/pages/forgot-password.js"></script>
</body>
</html>
