<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — MIST Job Portal</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <header id="app-header"></header>

  <main class="auth-wrap">
    <div class="auth-card card pad-lg">
      <h1 style="font-size:1.6rem">Welcome back</h1>
      <p class="muted">Sign in to manage your applications or job posts.</p>

      <form class="form" id="login-form" novalidate>
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <p style="margin:-.35rem 0 0;text-align:right;font-size:.8rem">
          <a href="/forgot-password.html">Forgot password?</a>
        </p>
        <p class="error-text hidden" id="login-error"></p>
        <p class="success-text hidden" id="login-success"></p>
        <button class="btn btn-primary btn-block" type="submit" id="login-submit">Sign in</button>
      </form>

      <p class="center muted" style="margin:1rem 0 0;font-size:.88rem">
        No account yet? <a href="/register.html">Create one</a>
      </p>
    </div>
  </main>

  <footer id="app-footer"></footer>

  <script src="/assets/js/config.js"></script>
  <script type="module" src="/assets/js/pages/login.js"></script>
</body>
</html>
