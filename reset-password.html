<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New password — MIST Job Portal</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <header id="app-header"></header>

  <main class="auth-wrap">
    <div class="auth-card card pad-lg">
      <h1 style="font-size:1.6rem">Choose a new password</h1>
      <p class="muted" id="reset-intro">Enter a new password for your account.</p>

      <form class="form hidden" id="reset-form" novalidate>
        <div class="field">
          <label for="password">New password</label>
          <input id="password" name="password" type="password" autocomplete="new-password" required minlength="6">
          <span class="hint">At least 6 characters.</span>
        </div>
        <div class="field">
          <label for="confirm">Confirm new password</label>
          <input id="confirm" name="confirm" type="password" autocomplete="new-password" required>
        </div>
        <p class="error-text hidden" id="reset-error"></p>
        <button class="btn btn-primary btn-block" type="submit" id="reset-submit">Update password</button>
      </form>

      <div class="hidden" id="reset-fallback">
        <p class="error-text" id="reset-message"></p>
        <a class="btn btn-ghost btn-block" href="/forgot-password.html">Request a new link</a>
      </div>

      <p class="center muted" style="margin:1rem 0 0;font-size:.88rem">
        <a href="/login.html">Back to sign in</a>
      </p>
    </div>
  </main>

  <footer id="app-footer"></footer>

  <script src="/assets/js/config.js"></script>
  <script type="module" src="/assets/js/pages/reset-password.js"></script>
</body>
</html>
